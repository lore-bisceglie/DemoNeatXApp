name: NeatX Lead Pipeline

on:
  schedule:
    # 09:23 Europe/Rome in estate, lunedi/mercoledi/venerdi.
    - cron: '23 7 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neatx-content-writes
  cancel-in-progress: false

jobs:
  prepare-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI dependency
        run: pip install google-generativeai

      - name: Build lead pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot_scripts/Automation/generate_content_calendar.py
          python bot_scripts/Automation/lead_pipeline.py

      - name: Commit lead pipeline
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Auto-leads: aggiorna pipeline prospect'
          file_pattern: 'leads/*.csv leads/*.md content_strategy/*.json content_strategy/*.md'
