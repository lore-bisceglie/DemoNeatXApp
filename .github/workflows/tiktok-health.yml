name: TikTok Health Check

on:
  workflow_dispatch:

jobs:
  check-tiktok-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv
          python -m playwright install chromium

      - name: Check TikTok session without publishing
        env:
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
        run: |
          cd bot_scripts/Social/ReelGenerator
          python check_tiktok_session.py

      - name: Upload TikTok diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-health-check
          path: bot_scripts/Social/ReelGenerator/tiktok_health_artifacts/
          retention-days: 3
