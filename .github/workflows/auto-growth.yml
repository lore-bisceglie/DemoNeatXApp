name: Macchina Crescita Social (Growth Hack)

on:
  schedule:
    # Esegue lo Sniper Commenti ogni 30 minuti
    - cron: '*/30 * * * *'
    # Esegue il Cacciatore Silenzioso 2 volte al giorno
    - cron: '15 9,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neatx-content-writes
  cancel-in-progress: false

jobs:
  run-growth-bots:
    runs-on: ubuntu-latest
    
    steps:
    - name: Controlla il codice sorgente
      uses: actions/checkout@v5
      with:
        persist-credentials: true
      
    - name: Installa Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Installa Librerie necessarie
      run: |
        python -m pip install --upgrade pip
        pip install instagrapi google-generativeai python-dotenv
        
    - name: Avvia lo Sniper dei Commenti (Ogni 30 min)
      continue-on-error: true
      env:
        INSTA_USER: ${{ secrets.INSTA_USER }}
        INSTA_PASS: ${{ secrets.INSTA_PASS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        cd bot_scripts/Social/GrowthHack
        python sniper_commenti.py || true

    - name: Avvia il Cacciatore Silenzioso (Like + Storie)
      if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 9,17 * * *'
      env:
        INSTA_USER: ${{ secrets.INSTA_USER }}
        INSTA_PASS: ${{ secrets.INSTA_PASS }}
        CACCIATORE_MAX_PROFILES: "3"
        CACCIATORE_MIN_PAUSE_SECONDS: "55"
        CACCIATORE_MAX_PAUSE_SECONDS: "140"
        CACCIATORE_MAX_STORIES_PER_USER: "1"
        CACCIATORE_STORY_LIKE_PROBABILITY: "0.75"
        CACCIATORE_POST_LIKE: "true"
        CACCIATORE_STORY_VIEW: "true"
        CACCIATORE_STORY_LIKE: "true"
      run: |
        cd bot_scripts/Social/GrowthHack
        python cacciatore_silenzioso.py || true

    - name: Avvia la Spia Virale (Solo una volta al giorno)
      # Un trucco per far girare la spia solo se sono circa le 12:00 UTC (usando un controllo bash semplice)
      if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 12')
      env:
        INSTA_USER: ${{ secrets.INSTA_USER }}
        INSTA_PASS: ${{ secrets.INSTA_PASS }}
      run: |
        cd bot_scripts/Social/GrowthHack
        python spia_virale.py || true
        
    - name: Avvia lo Sniping sui Competitor (Solo una volta al giorno)
      if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 12')
      env:
        INSTA_USER: ${{ secrets.INSTA_USER }}
        INSTA_PASS: ${{ secrets.INSTA_PASS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        cd bot_scripts/Social/GrowthHack
        python cacciatore_scontenti.py || true
        
    - name: Salva i dati dei nuovi video scoperti e dei clienti scontenti
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Auto-growth: aggiorna dati social"
        file_pattern: "bot_scripts/Social/GrowthHack/viral_hits.json bot_scripts/Social/GrowthHack/commented_posts.txt bot_scripts/Social/GrowthHack/scontenti.txt bot_scripts/Social/GrowthHack/cacciatore_seen.txt"
