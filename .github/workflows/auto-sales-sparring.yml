name: NeatX Sales Sparring (Franco)
on:
  schedule:
    # Esegue ogni mattina alle 07:00 UTC (così la sfida è pronta per la colazione)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Permette l'avvio manuale
permissions:
  contents: write
concurrency:
  group: neatx-content-writes
  cancel-in-progress: false
jobs:
  franco:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 📦 Installazione Dipendenze
        run: |
          pip install google-genai python-dotenv
      - name: 🥊 Esecuzione Sfida di Franco
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot_scripts/Sales_Sparring/franco_email.py 2>&1 | tee /tmp/workflow.log
      - name: 💾 Commit & Push Sfida
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales_challenges/*.md

          if git diff --cached --quiet; then
            echo "Nessuna nuova sfida da pubblicare."
            exit 0
          fi

          git commit -m "Franco: Nuova sfida di vendita giornaliera! 🥊"

          # Altri job automatici aggiornano gli stessi file su main. Integra
          # l'ultimo main prima del push e ritenta in caso di gara ravvicinata.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Sfida pubblicata al tentativo $attempt."
              exit 0
            fi
            echo "Push concorrente al tentativo $attempt; riprovo."
            sleep 3
          done

          echo "Impossibile pubblicare la sfida dopo 5 tentativi." >&2
          exit 1
      - name: Notifica Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests python-dotenv -q 2>/dev/null
          python bot_scripts/notify_telegram.py --workflow "NeatX Sales Sparring (Franco)" --status "${{ job.status }}" --log /tmp/workflow.log
