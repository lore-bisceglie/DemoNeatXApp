name: NeatX Sales Sparring (Franco)
on:
  schedule:
    # Esegue ogni mattina alle 07:00 UTC (così la sfida è pronta per la colazione)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Permette l'avvio manuale
permissions:
  contents: write
jobs:
  franco:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 📦 Installazione Dipendenze
        run: |
          pip install google-genai python-dotenv
      - name: 🥊 Esecuzione Sfida di Franco
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot_scripts/Sales_Sparring/franco_email.py
      - name: 💾 Commit & Push Sfida
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Franco: Nuova sfida di vendita giornaliera! 🥊"
          file_pattern: "sales_challenges/*.md"
