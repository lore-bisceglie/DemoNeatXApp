name: NeatX Viral Radar

on:
  schedule:
    # 10:00, 16:00 e 08:43 Europe/Rome in estate.
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neatx-content-writes
  cancel-in-progress: false

jobs:
  scan-ideas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI dependencies
        run: pip install google-generativeai instagrapi python-dotenv

      - name: Scan legacy viral radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTA_USER: ${{ secrets.INSTA_USER }}
          INSTA_PASS: ${{ secrets.INSTA_PASS }}
          GITHUB_ACTIONS: "true"
        run: python bot_scripts/Social/ViralRadar/viral_radar.py || true

      - name: Refresh unified strategy and radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot_scripts/Automation/generate_content_calendar.py
          python bot_scripts/Automation/viral_radar.py

      - name: Commit viral radar
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Auto-radar: aggiorna idee virali'
          file_pattern: 'content_strategy/*.json content_strategy/*.md'
