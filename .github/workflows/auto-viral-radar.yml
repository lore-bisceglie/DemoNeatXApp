name: NeatX Viral Radar

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-viral-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai instagrapi python-dotenv

      - name: Scan for viral trends and ideas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTA_USER: ${{ secrets.INSTA_USER }}
          INSTA_PASS: ${{ secrets.INSTA_PASS }}
          GITHUB_ACTIONS: "true"
        run: |
          cd bot_scripts/Social/ViralRadar
          python viral_radar.py

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-Radar: Idee virali e trend scansionati 🔍"
          file_pattern: "bot_scripts/Social/ViralRadar/*.json bot_scripts/Social/ViralRadar/*.txt"
