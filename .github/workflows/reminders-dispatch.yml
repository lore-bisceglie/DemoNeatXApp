name: NeatX Reminder Dispatcher

on:
  # L'avvio automatico è gestito da Vercel Cron. GitHub resta disponibile
  # anche come seconda rete di sicurezza gratuita: se uno dei due scheduler
  # parte per primo, l'outbox idempotente impedisce qualsiasi doppio invio.
  schedule:
    # 18:15 in Italia durante l'ora legale; il controllo nel job esclude
    # questo giro in inverno.
    - cron: "15 16 * * *"
    # 18:15 in Italia durante l'ora solare; il controllo nel job esclude
    # questo giro in estate.
    - cron: "15 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Controlla i collegamenti oppure invia realmente"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - send
      date:
        description: "Data appuntamenti (YYYY-MM-DD). Vuoto significa domani a Roma."
        required: false
        type: string
      confirm:
        description: "Per un invio reale scrivi SEND_REMINDERS"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: neatx-reminder-dispatch
  cancel-in-progress: false

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMINDER_AUTOMATION_ENABLED: ${{ secrets.REMINDER_AUTOMATION_ENABLED }}
      NEATX_REMINDER_TOKEN: ${{ secrets.N8N_REMINDER_WEBHOOK_TOKEN }}
      OPENWA_BASE_URL: ${{ secrets.OPENWA_BASE_URL }}
      OPENWA_API_KEY: ${{ secrets.OPENWA_API_KEY }}
      OPENWA_SESSION_ID: ${{ secrets.OPENWA_SESSION_ID }}
      REQUESTED_DATE: ${{ inputs.date }}
      MANUAL_MODE: ${{ inputs.mode }}
      MANUAL_CONFIRMATION: ${{ inputs.confirm }}
      EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Scarica il dispatcher
        uses: actions/checkout@v7

      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verifica autorizzazione e modalità
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$REMINDER_AUTOMATION_ENABLED" != "true" ]; then
              echo "Automazione disattivata: nessun messaggio verrà inviato."
              echo "send=false" >> "$GITHUB_OUTPUT"
              echo "check=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ROME_HOUR="$(TZ=Europe/Rome date +%H)"
            # GitHub può avviare i cron con ritardo. Accettiamo anche le 19:xx:
            # l'outbox idempotente impedisce comunque un doppio invio se
            # arrivano entrambe le esecuzioni tecniche (16 e 17 UTC).
            if [ "$ROME_HOUR" != "18" ] && [ "$ROME_HOUR" != "19" ]; then
              echo "Backup non necessario: fuori dalla finestra 18:00-19:59 italiane."
              echo "send=false" >> "$GITHUB_OUTPUT"
              echo "check=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MANUAL_MODE" = "check" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "check=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MANUAL_MODE" != "send" ] || [ "$MANUAL_CONFIRMATION" != "SEND_REMINDERS" ]; then
            echo "Invio manuale annullato: seleziona send e scrivi SEND_REMINDERS."
            exit 1
          fi

          echo "send=true" >> "$GITHUB_OUTPUT"
          echo "check=false" >> "$GITHUB_OUTPUT"

      - name: Controlla NeatX e WhatsApp senza inviare
        if: ${{ steps.guard.outputs.check == 'true' }}
        run: node scripts/reminders-dispatch.mjs --check

      - name: Invia i promemoria direttamente da GitHub
        if: ${{ steps.guard.outputs.send == 'true' }}
        run: node scripts/reminders-dispatch.mjs
