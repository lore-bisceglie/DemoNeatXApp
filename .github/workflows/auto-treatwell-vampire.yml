name: NeatX Treatwell Vampire
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Numero massimo di email vampiro da inviare oggi"
        required: false
        default: "5"
  schedule:
    - cron: "0 8 * * 1-5" # Ogni mattina dal lunedi al venerdi alle 08:30
jobs:
  run-vampire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install python-dotenv
      - name: Run Treatwell Vampire
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          NEXT_PUBLIC_ROOT_DOMAIN: "neatx.store"
        run: |
          python bot_scripts/GrowthHack/treatwell_vampire.py 2>&1 | tee /tmp/workflow.log
      - name: Notifica Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests python-dotenv -q 2>/dev/null
          python bot_scripts/notify_telegram.py --workflow "NeatX Treatwell Vampire" --status "${{ job.status }}" --log /tmp/workflow.log
