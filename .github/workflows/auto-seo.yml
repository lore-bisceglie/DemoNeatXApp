name: NeatX Auto-SEO Machine
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neatx-seo
  cancel-in-progress: false
jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install google-genai python-dotenv requests
      - name: Genera articolo SEO
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          cd bot_scripts/SEO_Machine
          python auto_seo_machine.py || true
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-SEO: nuovo articolo blog"
          file_pattern: "content/blog/*.md bot_scripts/SEO_Machine/satellites_content/*.md"
      - name: Notifica Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd bot_scripts
          POSTS=$(ls -t ../content/blog/*.md 2>/dev/null | head -1)
          if [ -n "$POSTS" ]; then
            TITLE=$(head -1 "$POSTS" 2>/dev/null | sed 's/.*"//;s/".*//')
            python notify_telegram.py "SEO Blog" "📝 <b>Articolo pubblicato:</b>\n$TITLE" "📝" "HTML"
          else
            python notify_telegram.py "SEO Blog" "Nessun articolo generato oggi" "⚠️"
          fi
