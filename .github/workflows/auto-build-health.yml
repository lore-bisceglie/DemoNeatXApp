name: NeatX Build Health

on:
  schedule:
    # 07:12 Europe/Rome in estate.
    - cron: '12 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check production domain
        run: curl --fail --silent --show-error --location https://www.neatx.store > /dev/null
