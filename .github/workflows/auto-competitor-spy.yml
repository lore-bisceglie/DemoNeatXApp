name: NeatX Competitor Spy
on:
  schedule:
    # Esegue ogni Venerdì alle 18:00 UTC
    - cron: '0 18 * * 5'
  workflow_dispatch: # Permette l'avvio manuale
permissions:
  contents: write
jobs:
  spy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 📦 Installazione Dipendenze
        run: |
          pip install google-genai
      - name: 🕵️ Esecuzione Script Spia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot_scripts/Competitor_Spy/spy.py 2>&1 | tee /tmp/workflow.log
      - name: 💾 Commit & Push Report
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Spy: Nuovo report di spionaggio generato 🕵️"
          file_pattern: "competitor_reports/*.md"
          pull_options: '--rebase'
      - name: Notifica Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests python-dotenv -q 2>/dev/null
          python bot_scripts/notify_telegram.py --workflow "NeatX Competitor Spy" --status "${{ job.status }}" --log /tmp/workflow.log
