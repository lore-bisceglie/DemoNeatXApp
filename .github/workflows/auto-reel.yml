name: NeatX Auto-Reel Machine

on:
  schedule:
    # Esegue ogni giorno alle 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch: # Permette l'avvio manuale dal sito di GitHub

jobs:
  run-reel-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python dependencies
        run: |
          pip install requests moviepy==1.0.3 edge-tts openai python-dotenv imageio-ffmpeg pydub numpy pillow

      - name: Run Massive Content Machine
        env:
          GITHUB_ACTIONS: "true"
        run: |
          cd bot_scripts/Social/ReelGenerator
          python mass_content_machine.py || true

      - name: Upload Finished Reels Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reels_Finiti
          path: bot_scripts/Social/ReelGenerator/Reels_Finiti/
          retention-days: 5
