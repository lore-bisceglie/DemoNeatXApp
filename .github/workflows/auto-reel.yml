name: NeatX Auto-Reel Machine
on:
  schedule:
    # GitHub Actions schedules in UTC. The two checks cover summer and winter
    # time; the gate below accepts only 14:xx in Rome: one reel per local day.
    - cron: '0 12,13 * * *'
  workflow_dispatch:
concurrency:
  group: neatx-auto-reel
  cancel-in-progress: false
jobs:
  run-reel-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check Italian posting window
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: push-triggered (solo schedule/workflow_dispatch)."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: publishing now."
            exit 0
          fi
          rome_hour="$(TZ=Europe/Rome date +'%H')"
          rome_time="$(TZ=Europe/Rome date +'%Y-%m-%d %H:%M:%S %Z')"
          if [[ "$rome_hour" == "14" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Posting window matched: $rome_time"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping outside posting window: $rome_time"
          fi
      - name: Checkout repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v5
      - name: Setup Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install System Dependencies (FFmpeg & ImageMagick)
        if: steps.gate.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
      - name: Install Python dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests moviepy==1.0.3 edge-tts google-genai google-auth-oauthlib google-api-python-client python-dotenv imageio-ffmpeg pydub numpy pillow playwright tiktok-uploader yt-dlp
          python -m playwright install chromium
      - name: Run Auto-Reel Publisher
        if: steps.gate.outputs.should_run == 'true'
        env:
          GITHUB_ACTIONS: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          TIKTOK_MAKE_WEBHOOK_URL: ${{ secrets.TIKTOK_MAKE_WEBHOOK_URL }}
          TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TIKTOK_HEADLESS: "true"
          STRICT_PUBLISH: "false"
        run: |
          cd bot_scripts/Social/ReelGenerator
          python auto_bot.py
      - name: Youtube Comment Bot (rispondi ai commenti)
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          cd bot_scripts/Social/ReelGenerator
          python youtube_comment_bot.py || true
      - uses: stefanzweifel/git-auto-commit-action@v7
        if: steps.gate.outputs.should_run == 'true'
        with:
          commit_message: "Auto-reel: aggiorna commenti YouTube processati"
          file_pattern: "bot_scripts/Social/ReelGenerator/youtube_replied.json"
      - name: Invia notifica Telegram
        if: steps.gate.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd bot_scripts
          SUMMARY="$(python Social/ReelGenerator/publish_report_summary.py)"
          python notify_telegram.py "Auto-Reel" "$SUMMARY" "[REEL]"
      - name: Upload generated reel artifact
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Published_Reel
          path: |
            bot_scripts/Social/ReelGenerator/reel_splitscreen_subbed.mp4
            bot_scripts/Social/ReelGenerator/assets/cover.png
            bot_scripts/Social/ReelGenerator/assets/cover.jpg
            bot_scripts/Social/ReelGenerator/reel_data.json
          retention-days: 5
