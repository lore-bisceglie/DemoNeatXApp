name: NeatX Daily Report
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests python-dotenv
      - name: Genera report giornaliero
        id: report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd bot_scripts

          TODAY=$(date +%Y-%m-%d)

          # Reel pubblicati oggi
          REEL_COUNT=$(grep -l "$TODAY" ../bot_scripts/Social/ReelGenerator/reel_data.json 2>/dev/null && echo "1" || echo "0")

          # Articoli SEO oggi
          SEO_COUNT=$(ls ../content/blog/*.md 2>/dev/null | wc -l)

          # Lead oggi
          LEAD_COUNT=$(ls ../leads/lead_messages_$TODAY.md 2>/dev/null && echo "1" || echo "0")

          # Negozio creato oggi
          STORE_COUNT=$(grep -c "$TODAY" ../super_logs.json 2>/dev/null || echo "0")

          # Errori oggi (ultimo report reel)
          IG_STATUS="?"
          if [ -f ../publish_report.json ]; then
            IG_STATUS=$(python Social/ReelGenerator/publish_report_summary.py "../publish_report.json" 2>&1 | tr '\n' ' | ')
          fi

          DATE_IT=$(TZ=Europe/Rome date +'%d/%m/%Y')
          REPORT=$(printf "\360\237\223\205 *Report %s*\n\n\360\237\223\271 Reel pubblicati: %s\n\360\237\223\235 Articoli SEO: %s\n\360\237\221\245 Lead raccolti: %s\n\360\237\217\252 Nuovi negozi: %s\n\n%s" "$DATE_IT" "$REEL_COUNT" "$SEO_COUNT" "$LEAD_COUNT" "$STORE_COUNT" "$IG_STATUS")

          python notify_telegram.py "Report Giornaliero" "$REPORT" "📊"
