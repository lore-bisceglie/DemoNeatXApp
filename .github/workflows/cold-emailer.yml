name: NeatX Cold Emailer
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Numero massimo di email da generare oggi"
        required: false
        default: "10"
  schedule:
    - cron: "0 8 * * 1-5" # Ogni mattina dal lunedi al venerdi alle 08:00
jobs:
  run-cold-emailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install google-genai python-dotenv
      - name: Run Cold Emailer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          python bot_scripts/Email/cold_emailer.py 2>&1 | tee /tmp/workflow.log
      - name: Upload Generated Emails
        uses: actions/upload-artifact@v4
        with:
          name: Generated_Cold_Emails
          path: email_generate/
          retention-days: 5
      - name: Notifica Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests python-dotenv -q 2>/dev/null
          python bot_scripts/notify_telegram.py --workflow "NeatX Cold Emailer" --status "${{ job.status }}" --log /tmp/workflow.log
