name: NeatX Auto-Post Machine
on:
  schedule:
    # 06:17 UTC = 08:17 Europe/Rome (estate), 07:17 inverno
    - cron: '17 6 * * *'
  workflow_dispatch:
concurrency:
  group: neatx-auto-post
  cancel-in-progress: false
jobs:
  run-post-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-genai playwright
          python -m playwright install --with-deps chromium
      - name: Run Auto-Post Publisher
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_TOKEN: ${{ github.token }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python bot_scripts/debug_meta.py
          python bot_scripts/Social/PostGenerator/auto_post_bot.py 2>&1 | tee /tmp/workflow.log
          exit ${PIPESTATUS[0]}
      - name: Notifica Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests python-dotenv -q 2>/dev/null
          python bot_scripts/notify_telegram.py --workflow "NeatX Auto-Post Machine" --status "${{ job.status }}" --log /tmp/workflow.log

