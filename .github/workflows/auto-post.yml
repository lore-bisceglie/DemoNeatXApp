name: NeatX Auto-Post Machine
on:
  schedule:
    # 06:00 UTC = 08:00 Europe/Rome (estate), 07:00 inverno
    - cron: '0 6 * * *'
  workflow_dispatch:
concurrency:
  group: neatx-auto-post
  cancel-in-progress: false
jobs:
  run-post-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-genai
      - name: Run Auto-Post Publisher
        env:
          GITHUB_ACTIONS: "true"
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot_scripts/Social/PostGenerator/auto_post_bot.py
